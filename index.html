        <div class="main-layout">

            <main class="svg-viewer">
                <div class="svg-container" id="svgContainer">
                    <div class="svg-wrapper" id="svgWrapper">
                        <svg id="svgDisplay" width="1200" height="800" viewBox="0 0 1200 800">
                            <defs>
                                <filter id="glow">
                                    <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                                    <feMerge>
                                        <feMergeNode in="coloredBlur" />
                                        <feMergeNode in="SourceGraphic" />
                                    </feMerge>
                                </filter>
                                <filter id="wire-glow">
                                    <feGaussianBlur stdDeviation="2" result="coloredBlur" />
                                    <feMerge>
                                        <feMergeNode in="coloredBlur" />
                                        <feMergeNode in="SourceGraphic" />
                                    </feMerge>
                                </filter>
                            </defs>
                            <!-- _cameraRotGroup: all content elements land here so rotation
                                 is applied in SVG world-space, not CSS — keeps getScreenCTM() correct. -->
                            <g id="_cameraRotGroup"></g>
                            <!-- Placeholder text -->

                        </svg>

        <div class="modal-backdrop" id="measureModal" role="dialog" aria-modal="true" aria-label="Measure unit scale">
            <div class="modal">
                <h3 class="modal-title">

                </h3>

                <div class="measure-tabs">
                    <button class="measure-tab active" data-system="px">Pixels</button>

                    <button class="measure-tab" data-system="imperial">Imperial</button>
                </div>

                <div class="measure-unit-group" data-system="px">
                    <div class="measure-unit-btns">
                        <button class="measure-unit-btn active" data-unit="px">px</button>
                    </div>
                    <p class="measure-hint">Distances shown in raw screen pixels.</p>
                </div>

                <div class="measure-unit-group" data-system="metric" style="display:none;">
                    <div class="measure-unit-btns">
                        <button class="measure-unit-btn" data-unit="mm">mm</button>
                        <button class="measure-unit-btn" data-unit="cm">cm</button>
                        <button class="measure-unit-btn" data-unit="m">m</button>
                    </div>
                </div>

                <div class="measure-unit-group" data-system="imperial" style="display:none;">
                    <div class="measure-unit-btns">
                        <button class="measure-unit-btn" data-unit="in">in</button>
                        <button class="measure-unit-btn" data-unit="ft">ft</button>
                        <button class="measure-unit-btn" data-unit="yd">yd</button>

                <div class="measure-scale-row" id="measureScaleRow" style="display:none;">
                    <input type="number" id="measurePxVal" class="measure-scale-input" value="1" min="0.001" step="any">
                    <span class="measure-scale-sep">px =</span>
                    <input type="number" id="measureUnitVal" class="measure-scale-input" value="1" min="0.001"
                        step="any">
                    <span class="measure-scale-unit-label" id="measureScaleUnitLabel">mm</span>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-ghost" id="measureModalCancel">Cancel</button>
                    <button class="btn btn-primary" id="measureModalOk">Start Measuring</button>
                </div>
            </div>
        </div>

        <!-- ======================================================
         NEW CANVAS MODAL
         ====================================================== -->
        <div class="modal-backdrop" id="newCanvasModal" role="dialog" aria-modal="true" aria-label="New canvas">
            <div class="modal">
                <h3 class="modal-title">
                    <iconify-icon icon="material-symbols:add-box-outline" style="font-size:16px;"></iconify-icon>
                    New Canvas
                </h3>

                <div class="prop-grid-2" style="gap:12px;">
                    <label class="prop-label">Name
                        <input type="text" id="newCanvasName" class="prop-input" style="width:100%;margin-top:4px;"
                            placeholder="My Schematic" value="New Canvas">
                    </label>
                    <div></div>
                    <label class="prop-label">Width (px)
                        <input type="number" id="newCanvasW" class="prop-input" style="width:100%;margin-top:4px;"

                    </label>
                    <label class="prop-label">Height (px)
                        <input type="number" id="newCanvasH" class="prop-input" style="width:100%;margin-top:4px;"

                    </label>

                <p class="measure-hint">
                    You can import files onto an existing canvas using the <strong>Load</strong> button.
                </p>

                <div class="modal-actions">

    <input type="file" id="hiddenFileInput" multiple
        accept=".svg,.svgz,image/svg+xml,.pdf,application/pdf,.png,image/png,.jpg,.jpeg,image/jpeg,.bmp,image/bmp,.tif,.tiff,image/tiff,.plt,.hpgl,.dwf,.dwfx"
        style="display:none;">

    <!-- ============================================================
     JS — loaded in dependency order: core → canvas → features → init
     ============================================================ -->
    <!-- Core -->
    <script src="src/js/core/cameraMatrix.js"></script>
    <script src="src/js/core/svgEditor.js"></script>

    <!-- Spatial index utilities (must load before geometryEngine) -->
    <script src="src/js/core/kdTree.js"></script>
    <script src="src/js/core/quadTree.js"></script>

    <!-- Canvas modules (Phase 1) -->
    <script src="src/js/canvas/snapGrid.js"></script>

    <script src="src/js/canvas/drawingTools.js"></script>
    <script src="src/js/canvas/clipboard.js"></script>
    <script src="src/js/canvas/alignDistribute.js"></script>
    <script src="src/js/canvas/propertyPanel.js"></script>

    <!-- Geometry Engine (4-phase pipeline — after canvas, before features) -->
    <script src="src/js/core/geometryEngine.js"></script>

    <!-- Domain Kits — portfolio-managed, not in engine submodule -->
    <script src="/assets/schema-editor/domains/domainManager.js"></script>
    <script src="/assets/schema-editor/domains/generalKit.js"></script>
    <script src="/assets/schema-editor/domains/electricalKit.js"></script>

    <script src="/assets/schema-editor/domains/constructionKit.js"></script>

    <!-- Features -->
    <script src="src/js/features/viewTransform.js"></script>
    <script src="src/js/features/wiringDiagram.js"></script>
    <script src="src/js/features/wireTracing.js"></script>
    <script src="src/js/features/highlights.js"></script>
    <script src="src/js/features/layers.js"></script>
    <script src="src/js/features/history.js"></script>
    <script src="src/js/features/uiControls.js"></script>

    <script>
        $(document).ready(function () {
            window.editor = new MobileSVGEditor();

            // Sidebar nav
            if (window.SidebarNav) {
                SidebarNav.render('#sidebar-nav-mount', 'SVG Editor');
            }

            // ── Phase 2: Domain Manager init ──────────────────
            window.editor.initDomainManager();

            // Palette toggle button
            $('#paletteToggleBtn').on('click', function () {
                const isOpen = $('#symbolPalettePanel').hasClass('open');
                $('#symbolPalettePanel').toggleClass('open');
                $(this).toggleClass('shifted', !isOpen);
                // Show palette for current mode if opening
                if (!isOpen && window.editor.activeMode !== 'general') {
                    window.editor._renderSymbolPalette(window.editor.activeMode);
                }
            });

            $('#palettePanelClose').on('click', function () {
                $('#symbolPalettePanel').removeClass('open');
                $('#paletteToggleBtn').removeClass('shifted');
            });

            // Auto-open palette when switching to a domain mode
            $(document).on('click', '.mode-pill', function () {
                const mode = $(this).data('mode');
                if (mode && mode !== 'general') {
                    $('#symbolPalettePanel').addClass('open');
                    $('#paletteToggleBtn').addClass('shifted');
                } else {
                    $('#symbolPalettePanel').removeClass('open');
                    $('#paletteToggleBtn').removeClass('shifted');
                }
                // Keep mobile select in sync
                if (mode) $('#modeSwitcherSelect').val(mode);
            });

            // Mobile select — triggers same switchMode logic
            $('#modeSwitcherSelect').on('change', function () {
                const mode = $(this).val();
                if (mode) {
                    window.editor.switchMode(mode);
                    // Sync pill state
                    $('.mode-pill').removeClass('active');
                    $(`.mode-pill[data-mode="${mode}"]`).addClass('active');
                    // Palette visibility
                    if (mode !== 'general') {
                        $('#symbolPalettePanel').addClass('open');
                        $('#paletteToggleBtn').addClass('shifted');
                    } else {
                        $('#symbolPalettePanel').removeClass('open');
                        $('#paletteToggleBtn').removeClass('shifted');
                    }
                }
            });

            // Grid size selector in side panel
            $('#gridSizeSelect').on('change', function () {
                window.editor.setGridSize($(this).val());
            });

            // Group / Ungroup / Delete buttons
            $('#groupBtn').on('click', () => window.editor.groupSelected());
            $('#ungroupBtn').on('click', () => window.editor.ungroupSelected());
            $('#deleteBtn').on('click', () => window.editor.deleteSelected());
            $('#straightenWiresBtn').on('click', () => window.editor._straightenSelectedWires());

            // Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => { });
            }

            // Fit initial placeholder to view
            setTimeout(() => window.editor.fitToView(), 100);

            // CWS IPC: send netlist to TAFNE
            $('#sendToTafneBtn').on('click', () => window.editor.sendNetlistToTafne());

            $('#exportSqlBtn').on('click', () => window.editor.exportAsSqlDdl());
            $('#exportMermaidSeqBtn').on('click', () => window.editor.exportAsMermaidSequence());
            $('#exportFsmJsonBtn').on('click', () => window.editor.exportAsFsmJson());
            $('#exportXStateBtn').on('click', () => window.editor.exportAsXState());
            $('#sendFsmToTafneBtn').on('click', () => window.editor.sendFsmToTafne());

            // Gate + star toast — fires on first export per session
            if (window.GxGate) {
                GxGate.init({
                    toolKey: 'schema_export_count',
                    gateKey: 'ginexys_schema_gate_shown',
                    repo: 'carnworkstudios/schema-editor',
                    triggerIds: [
                        'exportViewBtn', 'exportHtmlBtn', 'exportJsonBtn',
                        'sendToTafneBtn', 'batchExportBtn', 'exportSqlBtn',
                        'exportMermaidSeqBtn', 'exportFsmJsonBtn',
                        'exportXStateBtn', 'sendFsmToTafneBtn',
                    ],
                });
            }

            // CWS IPC: receive back-annotation from TAFNE (no-op when OS bridge absent)
            if (window.CwsBridge) CwsBridge.onData(function (envelope) {
                if (envelope?.hints?.action !== 'back-annotate') return;
                window.editor.receiveBackAnnotation(envelope);
            });
        });
    </script>
    <script>
        // Mode routing — path-based activation + URL sync on switch
        (function () {
            // On load: read pathname to activate correct mode
            var m = (location.pathname.match(/\/schema-editor\/([^\/]+)\//) || [])[1];
            if (m && m !== 'docs') {
                var btn = document.querySelector('.mode-pill[data-mode="' + m + '"]');
                if (btn) btn.click();
            }

            // On switch: keep URL in sync (enables shareable mode URLs + cross-tool routing)
            document.addEventListener('click', function (e) {
                var pill = e.target.closest('.mode-pill');
                if (!pill) return;
                var mode = pill.dataset.mode;
                if (mode) history.replaceState({}, '', '/tools/schema-editor/' + mode + '/');
            });
        })();
    </script>

    <script>
        // Ginexys Send button — opens IPC panel in OS or waitlist when standalone
        (function () {
            var sendBtn = document.getElementById('schemaSendBtn');
            if (!sendBtn) return;
            sendBtn.addEventListener('click', function () {
                if (window.parent !== window && window.parent.OsShell) {
                    window.parent.postMessage({ type: 'gx:open-ipc-panel' }, '*');
                } else {
                    var GxM = window.GxModals;
                    if (GxM) GxM.open('pro_waitlist', {
                        featureSlug: 'ipc-cross-tool',
                        subtitle: 'Send your Schema Editor netlist to TAFNE or PDF Processor. Cross-tool flow is a Pro feature.',
                    });
                }
            });
        })();
    </script>
